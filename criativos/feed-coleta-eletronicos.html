<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Criativo feed 1080x1080 — Coleta de eletrônicos</title>
<!-- Criativo de feed (1080x1080). Exportar: abrir no navegador em 1080x1080 e tirar print,
     ou usar o script de export descrito em criativos/README.md -->
<style>
:root{--green:#0f7a3d;--green-d:#0a5a2c;--deep:#0b2e1a;--lime:#9be15d;--ink:#122018;--wa:#25d366}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1080px;background:var(--deep)}
body{font-family:Inter,system-ui,sans-serif;color:#fff;overflow:hidden}
.ad{position:relative;overflow:hidden;width:1080px;height:1080px;padding:72px 76px 64px;display:flex;flex-direction:column;
  background:radial-gradient(900px 700px at 85% 10%,#14864a 0%,rgba(20,134,74,0) 60%),
             linear-gradient(160deg,#0f6a37 0%,#0a4a27 55%,#08301b 100%)}
/* símbolo de reciclagem grande, de fundo */
.bgmark{position:absolute;right:-150px;bottom:150px;width:620px;height:620px;color:#fff;opacity:.05}
svg{display:block}

.brand{display:flex;align-items:center;gap:16px}
.brand .logo{width:64px;height:64px;border-radius:16px;background:#fff;color:var(--green);display:grid;place-items:center}
.brand .logo svg{width:40px;height:40px}
.brand b{font-size:30px;font-weight:800;letter-spacing:-.01em;display:block}
.brand small{font-size:20px;color:#bfe3cb;font-weight:500}

.kicker{margin-top:76px;font-size:22px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--lime)}
h1{margin-top:18px;font-size:86px;line-height:1.02;font-weight:800;letter-spacing:-.035em}
h1 em{font-style:normal;color:var(--lime)}

.items{margin-top:64px;display:grid;grid-template-columns:repeat(6,1fr);gap:14px}
.it{background:rgba(255,255,255,.08);border:1.5px solid rgba(255,255,255,.14);border-radius:20px;
  padding:22px 6px 16px;text-align:center}
.it svg{width:52px;height:52px;margin:0 auto 12px;color:#fff}
.it span{font-size:17px;font-weight:600;color:#d9efe0}

.checks{margin-top:48px;display:flex;gap:34px;font-size:25px;font-weight:600}
.checks div{display:flex;align-items:center;gap:12px}
.checks i{width:36px;height:36px;border-radius:50%;background:var(--lime);color:var(--deep);display:grid;place-items:center;flex:none}
.checks i svg{width:22px;height:22px}

.cta{margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:24px}
.btn{display:flex;align-items:center;gap:18px;background:var(--wa);color:#06341a;border-radius:999px;
  padding:26px 42px 26px 32px;font-size:34px;font-weight:800;letter-spacing:-.01em;box-shadow:0 18px 40px rgba(0,0,0,.28)}
.btn svg{width:46px;height:46px}
.phone{text-align:right;font-size:20px;color:#bfe3cb;font-weight:500;line-height:1.35}
.phone b{display:block;font-size:30px;color:#fff;font-weight:800;letter-spacing:-.01em}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute">
  <symbol id="i-wa" viewBox="0 0 24 24"><path fill="currentColor" d="M17.5 14.4c-.3-.1-1.8-.9-2-1s-.5-.1-.7.1-.8 1-.9 1.2-.3.2-.6.1a8.2 8.2 0 0 1-4.1-3.6c-.3-.5.3-.5.9-1.6.1-.2 0-.4 0-.5l-.9-2.2c-.2-.6-.5-.5-.7-.5h-.6a1.1 1.1 0 0 0-.8.4 3.4 3.4 0 0 0-1.1 2.5 5.9 5.9 0 0 0 1.2 3.1 13.5 13.5 0 0 0 5.2 4.6c1.9.8 2.7.9 3.6.7a3.1 3.1 0 0 0 2-1.4 2.5 2.5 0 0 0 .2-1.4c-.1-.1-.3-.2-.6-.4ZM12 21.8a9.8 9.8 0 0 1-5-1.4l-.4-.2-3.7 1 1-3.6-.2-.4A9.8 9.8 0 1 1 12 21.8Zm8.4-18.2A11.8 11.8 0 0 0 1.8 17.8L.2 23.8l6.1-1.6a11.8 11.8 0 0 0 5.7 1.4A11.8 11.8 0 0 0 20.4 3.6Z"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" d="M20 6 9 17l-5-5"/></symbol>
  <symbol id="i-recycle" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 19H4.8a1.8 1.8 0 0 1-1.6-2.7l1.2-2.1M11 19h8.2a1.8 1.8 0 0 0 1.6-2.7l-1.2-2.1M14 16l-3 3 3 3M8.3 5.3l1.1-1.9a1.8 1.8 0 0 1 3.2 0l4.1 7.1M13.4 10.4l3.6.9.9-3.6M2 12.5l2.7-4.6"/><path d="m2 8.2 2.7.4.4-2.7"/></g></symbol>
  <symbol id="i-laptop" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="11" rx="1.5"/><path d="M2 19h20"/></g></symbol>
  <symbol id="i-phone" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="2" width="12" height="20" rx="2"/><path d="M11 18h2"/></g></symbol>
  <symbol id="i-monitor" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></g></symbol>
  <symbol id="i-printer" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9V2h12v7"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8" rx="1"/></g></symbol>
  <symbol id="i-cable" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9a2 2 0 0 1-2-2V5h6v2a2 2 0 0 1-2 2Z"/><path d="M3 5V2M7 5V2M5 9v3a4 4 0 0 0 4 4h6a4 4 0 0 1 4 4v2"/><path d="M17 15h4v-2a2 2 0 0 0-2-2 2 2 0 0 0-2 2Z" transform="rotate(180 19 13)"/></g></symbol>
  <symbol id="i-battery" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="17" height="10" rx="2"/><path d="M22 11v2M11 9l-2 3h4l-2 3"/></g></symbol>
</svg>

<div class="ad">
  <svg class="bgmark"><use href="#i-recycle"/></svg>

  <div class="brand">
    <div class="logo"><svg><use href="#i-recycle"/></svg></div>
    <div><b>Zé da Reciclagem</b><small>Coleta de eletrônicos · Rio de Janeiro</small></div>
  </div>

  <div class="kicker">Lixo eletrônico tem lugar certo</div>
  <h1>Eletrônico velho<br>parado aí?<br><em>A gente busca.</em></h1>

  <div class="items">
    <div class="it"><svg><use href="#i-laptop"/></svg><span>Notebooks</span></div>
    <div class="it"><svg><use href="#i-phone"/></svg><span>Celulares</span></div>
    <div class="it"><svg><use href="#i-monitor"/></svg><span>Monitores</span></div>
    <div class="it"><svg><use href="#i-printer"/></svg><span>Impressoras</span></div>
    <div class="it"><svg><use href="#i-cable"/></svg><span>Cabos</span></div>
    <div class="it"><svg><use href="#i-battery"/></svg><span>Baterias</span></div>
  </div>

  <div class="checks">
    <div><i><svg><use href="#i-check"/></svg></i>Coleta no seu endereço</div>
    <div><i><svg><use href="#i-check"/></svg></i>Casas, condomínios e empresas</div>
  </div>

  <div class="cta">
    <div class="btn"><svg><use href="#i-wa"/></svg>Agende pelo WhatsApp</div>
    <div class="phone">Fale com a gente<b>(21) 99038-0320</b></div>
  </div>
</div>
</body>
</html>
